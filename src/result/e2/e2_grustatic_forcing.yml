# --- Thi nghiem ---
experiment_name: e2_grustatic_forcing
run_dir: D:/Dev/ANCU Project/main/src/result/e2/runs
seed: 42
device: cuda:0

# --- Luu vuc va moc chia (A) ---
train_basin_file: D:/Dev/ANCU Project/main/src/result/e2/basins_e2.txt
validation_basin_file: D:/Dev/ANCU Project/main/src/result/e2/basins_e2.txt
test_basin_file: D:/Dev/ANCU Project/main/src/result/e2/basins_e2.txt
train_start_date: 01/10/1980
train_end_date: 30/09/1990
validation_start_date: 01/10/1990
validation_end_date: 30/09/1995
test_start_date: 01/10/1995
test_end_date: 30/09/2010

# --- Du lieu ---
dataset: caravan
data_dir: D:/Dev/ANCU Project/Caravan-csv
dynamic_inputs:
  - total_precipitation_sum
  - temperature_2m_min
  - temperature_2m_mean
  - temperature_2m_max
  - dewpoint_temperature_2m_min
  - dewpoint_temperature_2m_mean
  - dewpoint_temperature_2m_max
  - surface_net_solar_radiation_mean
  - surface_net_solar_radiation_max
  - surface_net_thermal_radiation_min
  - surface_net_thermal_radiation_mean
  - surface_net_thermal_radiation_max
  - surface_pressure_min
  - surface_pressure_mean
  - surface_pressure_max
  - u_component_of_wind_10m_min
  - u_component_of_wind_10m_mean
  - u_component_of_wind_10m_max
  - v_component_of_wind_10m_min
  - v_component_of_wind_10m_mean
  - v_component_of_wind_10m_max
  - potential_evaporation_sum_FAO_PENMAN_MONTEITH
target_variables:
  - streamflow
clip_targets_to_zero:
  - streamflow
static_attributes:
  - p_mean
  - pet_mean_FAO_PM
  - aridity_FAO_PM
  - seasonality_FAO_PM
  - frac_snow
  - high_prec_freq
  - high_prec_dur
  - low_prec_freq
  - low_prec_dur
  - ele_mt_sav
  - slp_dg_sav
  - area
  - for_pc_sse
  - crp_pc_sse
  - pst_pc_sse
  - urb_pc_sse
  - cly_pc_sav
  - slt_pc_sav
  - snd_pc_sav
  - soc_th_sav
  - swc_pc_syr
  - kar_pc_sse
  - gwt_cm_sav
  - lka_pc_sse
  - ire_pc_sse
  - dor_pc_pva

# --- Cua so truot ---
seq_length: 365
predict_last_n: 1

# --- Model ---
model: gru
head: regression
output_activation: linear
hidden_size: 256
output_dropout: 0.4

# --- Train ---
optimizer: Adam
loss: NSE
learning_rate:
  0: 0.001
  10: 0.0005
  25: 0.0001
batch_size: 256
epochs: 5
clip_gradient_norm: 1
num_workers: 0

# --- Danh gia ---
validate_every: 1
metrics:
  - NSE
  - KGE
  - Alpha-NSE
  - Beta-NSE
  - Pearson-r
  - FHV
  - FLV

# --- Log ---
log_interval: 5
log_tensorboard: False
log_n_figures: 0
save_weights_every: 1
